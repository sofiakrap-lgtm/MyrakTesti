# Tarkistaa mita myrak.fi oikeasti tarjoilee. Ei siirra mitaan.
# Ajopalvelimella ei ole selaimen valimuistia, joten tulos on totuus.

name: Tarkista myrak.fi

on:
  workflow_dispatch:

jobs:
  tarkista:
    runs-on: ubuntu-latest
    steps:
      - name: Hae sivusto ja vertaa
        continue-on-error: true
        shell: bash
        run: |
          set +e
          V=$GITHUB_RUN_ID
          hae () {
            curl -sS --max-time 30 -o "$2" -w "%{http_code}" "https://myrak.fi/$1?v=$V" 2>/tmp/err
            rc=$?
            if [ $rc -ne 0 ]; then printf ' (curl virhe %s: %s)' "$rc" "$(head -1 /tmp/err)"; fi
          }

          echo "=================== TIEDOTTEET ==================="
          : > /tmp/a.js
          echo "aktiiviset.js: HTTP $(hae aktiiviset.js /tmp/a.js)"
          echo "koko: $(wc -c < /tmp/a.js) tavua"
          echo "  vertailu: elokuu = 169852, syyskuun paivitys = 213000 luokkaa"
          if grep -q 'Tilannetiedote - telineiden purku ja loppusiivous' /tmp/a.js; then
            echo "  OK   syyskuun tiedotteet ovat palvelimella"
          elif grep -q 'kattorungon uusiminen' /tmp/a.js; then
            echo "  OSIN elokuun loppu on, mutta syyskuu puuttuu"
          elif grep -q '20.8.2026' /tmp/a.js; then
            echo "  EI   palvelimella on elokuun alun versio"
          else
            echo "  EI   palvelimella on vanha tiedosto tai sita ei saatu"
          fi
          echo "  tiedotteita tiedostossa: $(grep -o "date: '" /tmp/a.js | wc -l)"

          echo ""
          echo "=================== Y-TUNNUS ==================="
          : > /tmp/l.html
          echo "laskutusohjeet.html: HTTP $(hae laskutusohjeet.html /tmp/l.html)"
          if grep -q '2802156-7' /tmp/l.html; then echo "  OK  oikea Y-tunnus"; else echo "  EI  vanha Y-tunnus"; fi

          echo ""
          echo "=================== ETUSIVUN LAUSE ==================="
          : > /tmp/i.html
          echo "index.html: HTTP $(hae index.html /tmp/i.html)"
          if grep -q 'aliurakoitsijoita' /tmp/i.html; then echo "  EI  lause on yha sivulla"; else echo "  OK  lause on poistettu"; fi

          echo ""
          echo "=================== RUOTSI JA ENGLANTI ==================="
          : > /tmp/sv.html
          echo "sv/ajankohtaista.html: HTTP $(hae sv/ajankohtaista.html /tmp/sv.html)"
          : > /tmp/en.html
          echo "en/ajankohtaista.html: HTTP $(hae en/ajankohtaista.html /tmp/en.html)"

          echo ""
          echo "=================== YLIMAARAISET ==================="
          for p in myrak-siirto.zip myraksiirto.zip myrak-siirto/index.html; do
            echo "$p: HTTP $(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' "https://myrak.fi/$p")"
          done
          echo "(404 = hyva)"
          exit 0
