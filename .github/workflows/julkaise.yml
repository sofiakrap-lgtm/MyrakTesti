# Julkaisee myrak.fi:n Zonerille aina kun main-haaraan tulee muutoksia.
#
# Etsii sivuston juurikansion itse: kokeilee tunnetut vaihtoehdot ja valitsee
# sen, josta loytyy index.html. Nain polkua ei tarvitse arvata kasin.
#
# Salaisuudet (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    palvelimen osoite, esim. www76.zoner.fi
#   FTP_USERNAME  FTP-kayttajatunnus
#   FTP_PASSWORD  FTP-salasana (vain Secrets-valilehdelta)

name: Julkaise myrak.fi

# Automaattinen laukaisu on toistaiseksi pois paalta: kansion etsinta ei
# toimi Zonerin FTP-palvelinta vasten, joten jokainen push tuottaisi vain
# punaisen ajon ja turhan sahkopostin. Palautetaan kun polku on selvitetty.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Kokeiluajo - nayta mita siirtyisi, ala siirra mitaan"
        type: boolean
        default: false

concurrency:
  group: julkaise-myrak
  cancel-in-progress: false

jobs:
  julkaise:
    runs-on: ubuntu-latest
    env:
      S: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
      U: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
      P: ${{ secrets.FTP_PASSWORD }}
    steps:
      - name: Hae repo
        uses: actions/checkout@v4

      - name: Tarkista salaisuudet
        run: |
          puuttuu=""
          [ -z "$S" ] && puuttuu="$puuttuu FTP_SERVER"
          [ -z "$U" ] && puuttuu="$puuttuu FTP_USERNAME"
          [ -z "$P" ] && puuttuu="$puuttuu FTP_PASSWORD"
          if [ -n "$puuttuu" ]; then
            echo "::error::Naita arvoja ei loydy:$puuttuu"
            exit 1
          fi
          echo "Kunnossa."

      # Kokeilee vaihtoehdot ja valitsee sen, josta loytyy index.html.
      - name: Etsi sivuston juurikansio
        id: etsi
        run: |
          loydetty=""
          for d in "/public_html/" \
                   "/domains/myrak.fi/public_html/" \
                   "/home/deb02jage/domains/myrak.fi/public_html/" \
                   "/" ; do
            echo "--- kokeillaan: $d"
            if curl -sS --ssl-reqd --list-only -u "$U:$P" "ftp://$S$d" \
                 > /tmp/l.txt 2>/tmp/e.txt; then
              tr -d '\r' < /tmp/l.txt > /tmp/lc.txt
              echo "    listaus onnistui, $(wc -l < /tmp/lc.txt) rivia:"
              head -12 /tmp/lc.txt | sed 's/^/      /'
              if grep -qx "index.html" /tmp/lc.txt; then
                echo "    >>> index.html loytyi - tama on sivuston juuri"
                loydetty="$d"
                break
              fi
              echo "    (ei index.html - ei tama)"
            else
              echo "    listaus ei onnistunut: $(head -2 /tmp/e.txt)"
            fi
          done
          if [ -z "$loydetty" ]; then
            echo "::error::Sivuston juurikansiota ei loytynyt - mistaan kokeillusta polusta ei loytynyt index.html-tiedostoa. Mitaan ei siirretty."
            exit 1
          fi
          echo "kansio=$loydetty" >> "$GITHUB_OUTPUT"
          echo ""
          echo "Julkaistaan kansioon: $loydetty"

      - name: Siirra tiedostot Zonerille
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.S }}
          username: ${{ env.U }}
          password: ${{ env.P }}
          protocol: ftps
          server-dir: ${{ steps.etsi.outputs.kansio }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/node_modules/**
            **/*.md

      # Hakee sivuston verkosta. Ajopalvelimella ei ole selaimen valimuistia,
      # joten tama kertoo mita myrak.fi oikeasti tarjoilee.
      - name: Tarkista lopputulos
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          curl -sS -o /tmp/live.js "https://myrak.fi/aktiiviset.js?v=$GITHUB_RUN_ID" || true
          img=$(curl -sS -o /dev/null -w "%{http_code}" \
                "https://myrak.fi/kuvat/tiedotteet/aitio-2026-08-20-1.jpg" || echo 000)
          echo "aktiiviset.js: $(wc -c < /tmp/live.js 2>/dev/null || echo 0) tavua"
          echo "tiedotekuva:   HTTP $img"
          echo ""
          if grep -q "20.8.2026" /tmp/live.js 2>/dev/null && [ "$img" = "200" ]; then
            echo "VALMIS: sivusto on ajan tasalla."
          else
            echo "::error::Siirto meni lapi mutta sivusto ei paivittynyt. Kansio: ${{ steps.etsi.outputs.kansio }}"
            exit 1
          fi
