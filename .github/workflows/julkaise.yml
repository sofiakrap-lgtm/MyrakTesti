# Julkaisee myrak.fi:n Zonerille aina kun main-haaraan tulee muutoksia.
#
# Vaatii kolme salaisuutta (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    palvelimen osoite, esim. www76.zoner.fi
#   FTP_USERNAME  FTP-kayttajatunnus
#   FTP_PASSWORD  FTP-salasana
#
# Vapaaehtoiset muuttujat (sama sivu, Variables-valilehti):
#   FTP_SERVER_DIR  sivuston juurikansio palvelimella, oletus alla
#   FTP_PROTOCOL    ftps (oletus), ftp tai sftp

name: Julkaise myrak.fi

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Kokeiluajo - nayta mita siirtyisi, ala siirra mitaan"
        type: boolean
        default: true

concurrency:
  group: julkaise-myrak
  cancel-in-progress: false

jobs:
  julkaise:
    runs-on: ubuntu-latest
    steps:
      - name: Hae repo
        uses: actions/checkout@v4

      - name: Tarkista etta salaisuudet on asetettu
        env:
          S: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          puuttuu=""
          [ -z "$S" ] && puuttuu="$puuttuu FTP_SERVER"
          [ -z "$U" ] && puuttuu="$puuttuu FTP_USERNAME"
          [ -z "$P" ] && puuttuu="$puuttuu FTP_PASSWORD"
          if [ -n "$puuttuu" ]; then
            echo "::error::Naita arvoja ei loydy:$puuttuu"
            echo "Lisaa ne: Settings -> Secrets and variables -> Actions"
            echo "FTP_SERVER ja FTP_USERNAME kelpaavat kummalta valilehdelta tahansa (Secrets tai Variables)."
            echo "FTP_PASSWORD luetaan VAIN Secrets-valilehdelta - salasanaa ei saa laittaa Variables-puolelle,"
            echo "koska muuttujat nakyvat selkokielisina kaikille joilla on paasy repoon."
            exit 1
          fi
          echo "Salaisuudet kunnossa."

      - name: Siirra tiedostot Zonerille
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          server-dir: ${{ vars.FTP_SERVER_DIR || '/domains/myrak.fi/public_html/' }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          # Kehitystiedostot jaavat pois; kaikki sivuston oma sisalto menee mukaan.
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.claude/**
            **/node_modules/**
            **/*.md

      # Hakee sivuston suoraan verkosta. Ajopalvelimella ei ole selaimen
      # valimuistia, joten tama kertoo mita myrak.fi oikeasti tarjoilee.
      - name: Tarkista mita sivusto tarjoilee
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        continue-on-error: true
        run: |
          echo "=== aktiiviset.js ==="
          code=$(curl -sS -o /tmp/live.js -w "%{http_code}" \
                 "https://myrak.fi/aktiiviset.js?v=$GITHUB_RUN_ID" || echo 000)
          echo "HTTP $code, koko $(wc -c < /tmp/live.js 2>/dev/null || echo 0) tavua"
          if grep -q "20.8.2026" /tmp/live.js 2>/dev/null; then
            echo "OK: palvelimella on UUSI aktiiviset.js (20.8.2026 loytyi)."
            echo "    -> jos selain nayttaa vanhaa, kyse on selaimen valimuistista."
          else
            echo "HUOM: palvelimella on VANHA aktiiviset.js."
            echo "    -> siirto meni vaaraan kansioon."
          fi
          echo ""
          echo "=== tiedotekuva ==="
          img=$(curl -sS -o /dev/null -w "%{http_code}" \
                "https://myrak.fi/kuvat/tiedotteet/aitio-2026-08-20-1.jpg" || echo 000)
          echo "HTTP $img   (200 = kuva on palvelimella, 404 = ei ole)"

      # Listaa FTP-kansiot. Virhekoodi naytetaan, jottei epaonnistuminen jaa
      # huomaamatta niin kuin aiemmin.
      - name: Listaa FTP-kansiot
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        continue-on-error: true
        env:
          S: ${{ secrets.FTP_SERVER || vars.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
          D: ${{ vars.FTP_SERVER_DIR || '/public_html/' }}
        run: |
          for polku in "/" "$D"; do
            echo "=== ftp://$S$polku ==="
            curl -sS --ssl-reqd --list-only -u "$U:$P" "ftp://$S$polku" > /tmp/l.txt 2>/tmp/e.txt
            rc=$?
            echo "curl paluukoodi: $rc"
            if [ "$rc" -ne 0 ]; then
              echo "virhe: $(head -3 /tmp/e.txt)"
            else
              echo "tiedostoja: $(wc -l < /tmp/l.txt)"
              head -25 /tmp/l.txt
            fi
            echo ""
          done
