<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tuotteet – The Cake Atelier (demo)</title>
  <meta name="description" content="Selaa The Cake Atelierin tuotteita: tilauskakut, leivonnaiset ja lahjakortit. Valitse koko ja ruokavalio – hinta päivittyy.">
  <link rel="icon" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="tuotteet.html">
  <a class="skip-link" href="#main">Siirry sisältöön</a>
  <div id="site-header"></div>

  <main id="main">
    <section class="wrap section section--tight">
      <span class="eyebrow">Verkkokauppa</span>
      <h1>Tuotteet</h1>
      <p class="lead">
        Valitse koko ja ruokavalio – hinta päivittyy valinnan mukaan. Tuotteet
        noudetaan myymälästä. Huomioithan, että sesonkiaikoina valikoima voi vaihdella.
      </p>

      <!-- Haku + suodatus -->
      <div class="shop-tools" style="margin-top:1.5rem">
        <div class="shop-search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="shop-search-input" placeholder="Hae tuotetta…" aria-label="Hae tuotetta">
        </div>
        <div class="shop-filters" id="shop-filters" role="group" aria-label="Suodata kategorian mukaan"><!-- chipit JS:llä --></div>
      </div>

      <!-- Tuoteruudukko (renderöidään site.js:stä) -->
      <div class="grid grid--auto" id="shop-grid" style="margin-top:1rem"><!-- tuotteet JS:llä --></div>
    </section>
  </main>

  <div id="site-footer"></div>
  <script src="site.js"></script>
  <script src="main.js"></script>
</body>
</html>
